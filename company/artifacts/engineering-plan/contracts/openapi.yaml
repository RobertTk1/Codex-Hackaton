openapi: 3.1.0
info:
  title: Magic Mirror Application API
  version: 2026-07-20.2
  description: |
    Machine-readable operation inventory for the Magic Mirror browser/API boundary.
    contracts/api.md is the normative source for operation-specific success projections,
    persistence effects, idempotency semantics, and named errors; this file fixes paths,
    methods, authentication, headers, and request shapes for implementation and tests.
servers:
  - url: /api/v1
security:
  - SupabaseBearer: []
tags:
  - name: public
  - name: session
  - name: profile
  - name: photos
  - name: taste
  - name: auth-transfer
  - name: reports
  - name: catalog
  - name: bag
  - name: handoff
  - name: live
  - name: account
paths:
  /configuration:
    get:
      operationId: getPublicConfiguration
      tags: [public]
      security: []
      responses: { '200': { $ref: './schemas.yaml#/responses/PublicConfiguration' }, default: { $ref: '#/components/responses/Error' } }
  /resume:
    get:
      operationId: resolveResume
      tags: [session]
      responses: { '200': { $ref: './schemas.yaml#/responses/ResumeDecision' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/resume:
    post:
      operationId: createOrResumeProfile
      tags: [profile]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileResumeInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ProfileSnapshot' }, '201': { $ref: './schemas.yaml#/responses/ProfileSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /style-home:
    get:
      operationId: getStyleHome
      tags: [session]
      responses: { '200': { $ref: './schemas.yaml#/responses/StyleHomeSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    get:
      operationId: getProfileSnapshot
      tags: [profile]
      responses: { '200': { $ref: './schemas.yaml#/responses/ProfileSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/conversation/turns:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    post:
      operationId: submitConversationTurn
      tags: [profile]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationTurnInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ConversationTurnResult' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/answers/{field}:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { name: field, in: path, required: true, schema: { $ref: '#/components/schemas/ProfileField' } }
    put:
      operationId: replaceProfileAnswer
      tags: [profile]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileAnswerInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ConversationTurnResult' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/brand-sizes:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    put:
      operationId: putBrandSizes
      tags: [profile]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandSizesInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ProfileSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/favorite-brands:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    put:
      operationId: putFavoriteBrands
      tags: [profile]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FavoriteBrandsInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ProfileSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/consents:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    post:
      operationId: recordConsent
      tags: [profile]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentInput' } } } }
      responses: { '201': { $ref: './schemas.yaml#/responses/ConsentReceipt' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/report-runs:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    post:
      operationId: submitProfileForReport
      tags: [reports]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportSubmissionInput' } } } }
      responses: { '202': { $ref: './schemas.yaml#/responses/AcceptedReportRun' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/photo-upload-slots:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    post:
      operationId: createPhotoUploadSlot
      tags: [photos]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSlotInput' } } } }
      responses: { '201': { $ref: './schemas.yaml#/responses/PhotoUploadSlot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/photos:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    get:
      operationId: listPhotos
      tags: [photos]
      responses: { '200': { $ref: './schemas.yaml#/responses/PhotoCollection' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/photos/{photoId}/complete:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { $ref: '#/components/parameters/PhotoId' }
    post:
      operationId: completePhotoUpload
      tags: [photos]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoCompleteInput' } } } }
      responses: { '202': { $ref: './schemas.yaml#/responses/AcceptedPhoto' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/photos/{photoId}:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { $ref: '#/components/parameters/PhotoId' }
    delete:
      operationId: deletePhoto
      tags: [photos]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      responses:
        '204':
          description: Deleted
          headers:
            X-Request-Id: { schema: { type: string, minLength: 1, maxLength: 160 } }
            X-Profile-Revision: { required: true, schema: { type: integer, minimum: 1 } }
        default: { $ref: '#/components/responses/Error' }
  /profiles/{profileId}/photos/order:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    put:
      operationId: reorderPhotos
      tags: [photos]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoOrderInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/PhotoOrderResult' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/photos/{photoId}/extraction-retries:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { $ref: '#/components/parameters/PhotoId' }
    post:
      operationId: retryPhotoExtraction
      tags: [photos]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { $ref: './schemas.yaml#/responses/AcceptedPhoto' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/extraction-summary:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    get:
      operationId: getExtractionSummary
      tags: [photos]
      responses: { '200': { $ref: './schemas.yaml#/responses/ExtractionSummary' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/garments/{garmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { name: garmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    patch:
      operationId: reviewExtractedGarment
      tags: [photos]
      parameters: [{ $ref: '#/components/parameters/IfMatchRevision' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GarmentReviewInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ExtractionSummary' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/taste-candidates:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    post:
      operationId: ensureTasteCandidates
      tags: [taste]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TasteEnsureInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/TasteCalibrationSnapshot' }, '202': { $ref: './schemas.yaml#/responses/AcceptedTasteCalibration' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/taste-calibration:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    get:
      operationId: getTasteCalibration
      tags: [taste]
      parameters: [{ name: afterPosition, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }]
      responses: { '200': { $ref: './schemas.yaml#/responses/TasteCalibrationSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/taste-reactions/{candidateId}:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { name: candidateId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    put:
      operationId: putTasteReaction
      tags: [taste]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TasteReactionInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/TasteCalibrationSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /profiles/{profileId}/taste-reactions/{candidateId}/undo:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
      - { name: candidateId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      operationId: undoTasteReaction
      tags: [taste]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { $ref: './schemas.yaml#/responses/TasteCalibrationSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /auth/transfers:
    post:
      operationId: prepareAnonymousTransfer
      tags: [auth-transfer]
      parameters:
        - { $ref: '#/components/parameters/IfMatchRevision' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferPrepareInput' } } } }
      responses: { '201': { $ref: './schemas.yaml#/responses/TransferPreparation' }, default: { $ref: '#/components/responses/Error' } }
  /auth/transfers/consume:
    post:
      operationId: consumeAnonymousTransfer
      tags: [auth-transfer]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferConsumeInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/TransferResult' }, default: { $ref: '#/components/responses/Error' } }
  /auth/transfers/current:
    delete:
      operationId: cancelAnonymousTransfer
      tags: [auth-transfer]
      responses:
        '204':
          description: Cancelled
          headers: { X-Request-Id: { schema: { type: string, minLength: 1, maxLength: 160 } } }
        default: { $ref: '#/components/responses/Error' }
  /report-runs/{runId}:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      operationId: getReportRun
      tags: [reports]
      responses: { '200': { $ref: './schemas.yaml#/responses/ReportRunSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /report-runs/{runId}/retries:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    post:
      operationId: retryReportRun
      tags: [reports]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { $ref: './schemas.yaml#/responses/AcceptedReportRun' }, default: { $ref: '#/components/responses/Error' } }
  /report-runs/{runId}/notification:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    put:
      operationId: requestReportNotification
      tags: [reports]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/NotificationPreference' }, default: { $ref: '#/components/responses/Error' } }
  /reports/current:
    get:
      operationId: getCurrentReport
      tags: [reports]
      responses: { '200': { $ref: './schemas.yaml#/responses/ReportDocument' }, default: { $ref: '#/components/responses/Error' } }
  /reports/{reportId}/sections/{sectionType}:
    parameters:
      - { $ref: '#/components/parameters/ReportId' }
      - { name: sectionType, in: path, required: true, schema: { type: string, enum: [overview, color, body_style] } }
    get:
      operationId: getReportSection
      tags: [reports]
      responses: { '200': { $ref: './schemas.yaml#/responses/ReportSection' }, default: { $ref: '#/components/responses/Error' } }
  /reports/{reportId}/recommendations:
    parameters: [{ $ref: '#/components/parameters/ReportId' }]
    get:
      operationId: listRecommendations
      tags: [reports]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses: { '200': { $ref: './schemas.yaml#/responses/RecommendationCollection' }, default: { $ref: '#/components/responses/Error' } }
  /reports/{reportId}/feedback:
    parameters: [{ $ref: '#/components/parameters/ReportId' }]
    post:
      operationId: submitReportFeedback
      tags: [reports]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackInput' } } } }
      responses: { '201': { $ref: './schemas.yaml#/responses/ReportFeedbackReceipt' }, default: { $ref: '#/components/responses/Error' } }
  /reports/{reportId}/recalibrations:
    parameters: [{ $ref: '#/components/parameters/ReportId' }]
    post:
      operationId: startRecalibration
      tags: [reports]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmationInput' } } } }
      responses: { '201': { $ref: './schemas.yaml#/responses/ProfileSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /catalog/search:
    post:
      operationId: searchCatalog
      tags: [catalog]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogSearchInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/CatalogSearchResult' }, default: { $ref: '#/components/responses/Error' } }
  /catalog/product:
    post:
      operationId: getProduct
      tags: [catalog]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/ProductSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /catalog/alternatives:
    post:
      operationId: getAlternatives
      tags: [catalog]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlternativesInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/CatalogSearchResult' }, default: { $ref: '#/components/responses/Error' } }
  /bag:
    get:
      operationId: listBag
      tags: [bag]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses: { '200': { $ref: './schemas.yaml#/responses/BagCollection' }, default: { $ref: '#/components/responses/Error' } }
  /bag/items:
    post:
      operationId: addBagItem
      tags: [bag]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BagItemInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/BagItemSnapshot' }, '201': { $ref: './schemas.yaml#/responses/BagItemSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /bag/items/{bagItemId}:
    parameters: [{ name: bagItemId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    delete:
      operationId: removeBagItem
      tags: [bag]
      responses:
        '204':
          description: Removed
          headers: { X-Request-Id: { schema: { type: string, minLength: 1, maxLength: 160 } } }
        default: { $ref: '#/components/responses/Error' }
  /retailer-handoffs/prepare:
    post:
      operationId: prepareRetailerHandoff
      tags: [handoff]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogReference' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/HandoffPreview' }, default: { $ref: '#/components/responses/Error' } }
  /retailer-handoffs/confirm:
    post:
      operationId: confirmRetailerHandoff
      tags: [handoff]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HandoffTokenInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/HandoffDestination' }, default: { $ref: '#/components/responses/Error' } }
  /live-sessions:
    post:
      operationId: createLiveSession
      tags: [live]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSessionInput' } } } }
      responses: { '201': { $ref: './schemas.yaml#/responses/LiveSessionBootstrap' }, default: { $ref: '#/components/responses/Error' } }
  /live-sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    patch:
      operationId: transitionLiveSession
      tags: [live]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveTransitionInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/LiveSessionSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /live-sessions/{sessionId}/credentials:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: mintRealtimeCredentials
      tags: [live]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/RealtimeCredentialBundle' }, default: { $ref: '#/components/responses/Error' } }
  /live-sessions/{sessionId}/actions:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: proposeLiveAction
      tags: [live]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveActionProposal' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/LiveActionDecision' }, default: { $ref: '#/components/responses/Error' } }
  /live-sessions/{sessionId}/actions/confirm:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: confirmLiveAction
      tags: [live]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmationTokenInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/LiveActionResult' }, default: { $ref: '#/components/responses/Error' } }
  /live-sessions/{sessionId}/end:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: endLiveSession
      tags: [live]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveEndInput' } } } }
      responses: { '200': { $ref: './schemas.yaml#/responses/LiveSessionSnapshot' }, default: { $ref: '#/components/responses/Error' } }
  /account/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmationInput' } } } }
      responses: { '202': { $ref: './schemas.yaml#/responses/DeletionStatus' }, default: { $ref: '#/components/responses/Error' } }
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProfileId: { name: profileId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PhotoId: { name: photoId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    RunId: { name: runId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReportId: { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SessionId: { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    IfMatchRevision: { name: If-Match-Revision, in: header, required: true, schema: { type: integer, minimum: 1 } }
    Cursor: { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 500 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
  responses:
    Error:
      description: Normalized failure
      headers: { X-Request-Id: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Uuid: { type: string, format: uuid }
    NullableUuid: { type: [string, 'null'], format: uuid }
    Error:
      type: object
      additionalProperties: false
      required: [error, code, details, requestId]
      properties:
        error: { type: string, minLength: 1, maxLength: 240 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$' }
        details: { $ref: '#/components/schemas/ErrorDetails' }
        requestId: { type: string, minLength: 1, maxLength: 160 }
    ErrorField: { type: string, enum: [name, adult_confirmation, gender, age, height, weight, fit_preference, favorite_brands, brand_sizes, photo, taste, consent, account, product, live_action] }
    EmptyErrorDetails: { type: object, additionalProperties: false }
    FieldErrorDetails:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { $ref: '#/components/schemas/ErrorField' }
        reason: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9_]+$' }
    FieldsErrorDetails:
      type: object
      additionalProperties: false
      required: [fields]
      properties: { fields: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/FieldErrorDetails' } } }
    RevisionErrorDetails:
      type: object
      additionalProperties: false
      required: [expectedRevision, currentRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        currentRevision: { type: integer, minimum: 1 }
    RetryErrorDetails:
      type: object
      additionalProperties: false
      required: [retryable, retryAfterMs]
      properties:
        retryable: { type: boolean }
        retryAfterMs: { type: integer, minimum: 0, maximum: 3600000 }
    StageErrorDetails:
      type: object
      additionalProperties: false
      required: [stage, retryable]
      properties:
        stage: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9_]+$' }
        retryable: { type: boolean }
    ItemErrorDetails:
      type: object
      additionalProperties: false
      required: [itemId, reason]
      properties:
        itemId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9_]+$' }
    MinimumErrorDetails:
      type: object
      additionalProperties: false
      required: [minimum, current]
      properties:
        minimum: { type: integer, minimum: 0, maximum: 20 }
        current: { type: integer, minimum: 0, maximum: 20 }
    AuthMethodsErrorDetails:
      type: object
      additionalProperties: false
      required: [allowedMethods]
      properties: { allowedMethods: { type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: { type: string, enum: [google, magic_link] } } }
    ErrorDetails:
      oneOf:
        - { $ref: '#/components/schemas/EmptyErrorDetails' }
        - { $ref: '#/components/schemas/FieldErrorDetails' }
        - { $ref: '#/components/schemas/FieldsErrorDetails' }
        - { $ref: '#/components/schemas/RevisionErrorDetails' }
        - { $ref: '#/components/schemas/RetryErrorDetails' }
        - { $ref: '#/components/schemas/StageErrorDetails' }
        - { $ref: '#/components/schemas/ItemErrorDetails' }
        - { $ref: '#/components/schemas/MinimumErrorDetails' }
        - { $ref: '#/components/schemas/AuthMethodsErrorDetails' }
    ProfileResumeInput:
      type: object
      additionalProperties: false
      required: [entry]
      properties: { entry: { type: string, enum: [landing, login, new_report] } }
    PersonalProfileField: { type: string, enum: [name, adult_confirmation, gender, age, height, weight, fit_preference] }
    ConversationTargetField: { type: string, enum: [name, adult_confirmation, gender, age, height, weight, fit_preference, favorite_brands, brand_sizes] }
    ProfileField: { $ref: '#/components/schemas/PersonalProfileField' }
    ConversationTurnInput:
      type: object
      additionalProperties: false
      required: [turnId, targetField, text, locale]
      properties:
        turnId: { $ref: '#/components/schemas/Uuid' }
        targetField: { $ref: '#/components/schemas/ConversationTargetField' }
        text: { type: string, minLength: 1, maxLength: 500 }
        locale: { type: string, minLength: 2, maxLength: 35 }
    ProfileAnswerInput:
      type: object
      additionalProperties: false
      required: [turnId, text, locale, reason]
      properties:
        turnId: { $ref: '#/components/schemas/Uuid' }
        text: { type: string, minLength: 1, maxLength: 500 }
        locale: { type: string, minLength: 2, maxLength: 35 }
        reason: { type: string, const: customer_edit }
    FavoriteBrand:
      type: object
      additionalProperties: false
      required: [brandName, preferenceOrder]
      properties:
        brandName: { type: string, minLength: 1, maxLength: 80 }
        preferenceOrder: { type: integer, minimum: 1, maximum: 20 }
    FavoriteBrandsInput:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/FavoriteBrand' } } }
    BrandSize:
      type: object
      additionalProperties: false
      required: [brandName, garmentType, sizeStatus, sizeLabel, preferenceOrder]
      properties:
        brandName: { type: string, minLength: 1, maxLength: 80 }
        garmentType: { type: string, enum: [tops, knitwear, dresses, skirts, jeans, trousers, shorts, outerwear, activewear, swimwear, shoes, other] }
        sizeStatus: { type: string, enum: [known, unknown, not_applicable] }
        sizeLabel: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        preferenceOrder: { type: integer, minimum: 1, maximum: 20 }
      allOf:
        - if: { properties: { sizeStatus: { const: known } }, required: [sizeStatus] }
          then: { properties: { sizeLabel: { type: string, minLength: 1, maxLength: 40 } } }
          else: { properties: { sizeLabel: { type: 'null' } } }
    BrandSizesInput:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, minItems: 0, maxItems: 20, items: { $ref: '#/components/schemas/BrandSize' } } }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [purpose, decision, policyVersion, copySha256]
      properties:
        purpose: { type: string, enum: [profile_processing, photo_analysis, garment_extraction, generated_likeness_preview, account_connection, live_camera, live_microphone, gemini_visual_context] }
        decision: { type: string, enum: [granted, revoked] }
        policyVersion: { type: string, minLength: 1, maxLength: 80 }
        copySha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    ReportSubmissionInput:
      type: object
      additionalProperties: false
      required: [profileRevision, notifyWhenReady]
      properties:
        profileRevision: { type: integer, minimum: 1 }
        notifyWhenReady: { type: boolean }
    PhotoSlotInput:
      type: object
      additionalProperties: false
      required: [position, declaredMediaType, declaredByteSize]
      properties:
        position: { type: integer, minimum: 1, maximum: 12 }
        declaredMediaType: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, image/heif] }
        declaredByteSize: { type: integer, minimum: 1, maximum: 15728640 }
        replacesPhotoId: { $ref: '#/components/schemas/NullableUuid' }
    PhotoCompleteInput:
      type: object
      additionalProperties: false
      required: [completionToken]
      properties: { completionToken: { type: string, minLength: 20, maxLength: 4000 } }
    PhotoOrderInput:
      type: object
      additionalProperties: false
      required: [orderedPhotoIds]
      properties: { orderedPhotoIds: { type: array, minItems: 0, maxItems: 12, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } } }
    GarmentReviewInput:
      type: object
      additionalProperties: false
      required: [reviewStatus]
      properties: { reviewStatus: { type: string, enum: [confirmed, rejected] } }
    TasteEnsureInput:
      type: object
      additionalProperties: false
      required: [allowCuratedFallback]
      properties: { allowCuratedFallback: { type: boolean, const: true } }
    TasteReactionInput:
      type: object
      additionalProperties: false
      required: [reaction]
      properties: { reaction: { type: string, enum: [love, hate, maybe] } }
    TransferPrepareInput:
      type: object
      additionalProperties: false
      required: [profileId, method]
      properties:
        profileId: { $ref: '#/components/schemas/Uuid' }
        method: { type: string, enum: [google, magic_link] }
    TransferConsumeInput:
      type: object
      additionalProperties: false
      required: [profileId, confirmation]
      properties:
        profileId: { $ref: '#/components/schemas/Uuid' }
        confirmation: { type: string, enum: [preserve_as_new_draft, activate_if_no_existing_profile] }
    NotificationInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties: { enabled: { type: boolean, const: true } }
    FeedbackInput:
      type: object
      additionalProperties: false
      required: [sectionType, kind, note]
      properties:
        sectionType: { type: [string, 'null'], enum: [overview, color, body_style, null] }
        kind: { type: string, enum: [helpful, unclear, incorrect, recalibrate] }
        note: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
    ConfirmationInput:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties: { confirmed: { type: boolean, const: true } }
    CatalogReferenceBase:
      type: object
      required: [productRef, shopRef, variantRef]
      properties:
        productRef: { type: string, minLength: 1, maxLength: 500 }
        shopRef: { type: string, minLength: 1, maxLength: 500 }
        variantRef: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    CatalogReference:
      allOf: [{ $ref: '#/components/schemas/CatalogReferenceBase' }]
      unevaluatedProperties: false
    CatalogSearchInput:
      type: object
      additionalProperties: false
      required: [query, country, styleSignals]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 80 }
        color: { type: string, minLength: 1, maxLength: 80 }
        size: { type: string, minLength: 1, maxLength: 40 }
        priceMinorMax: { type: integer, minimum: 0 }
        country: { type: string, const: US }
        styleSignals: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 80 } }
    ProductInput:
      allOf:
        - { $ref: '#/components/schemas/CatalogReferenceBase' }
        - type: object
          properties:
            selectedOptions:
              type: array
              maxItems: 12
              items:
                type: object
                additionalProperties: false
                required: [name, label]
                properties: { name: { type: string, minLength: 1, maxLength: 80 }, label: { type: string, minLength: 1, maxLength: 80 } }
      unevaluatedProperties: false
    AlternativesInput:
      allOf:
        - { $ref: '#/components/schemas/CatalogReferenceBase' }
        - type: object
          properties: { styleConstraints: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 80 } } }
      unevaluatedProperties: false
    BagItemInput:
      allOf:
        - { $ref: '#/components/schemas/CatalogReferenceBase' }
        - type: object
          required: [source, sourceId]
          properties:
            source: { type: string, enum: [recommendation, live_session, product_detail] }
            sourceId: { type: [string, 'null'], format: uuid }
        - if: { properties: { source: { const: product_detail } }, required: [source] }
          then: { properties: { sourceId: { type: 'null' } } }
          else: { properties: { sourceId: { $ref: '#/components/schemas/Uuid' } } }
      unevaluatedProperties: false
    HandoffTokenInput:
      type: object
      additionalProperties: false
      required: [handoffToken]
      properties:
        handoffToken: { type: string, minLength: 20, maxLength: 4000 }
    ConfirmationTokenInput:
      type: object
      additionalProperties: false
      required: [confirmationToken]
      properties:
        confirmationToken: { type: string, minLength: 20, maxLength: 4000 }
    LiveSessionInput:
      allOf:
        - { $ref: '#/components/schemas/CatalogReferenceBase' }
        - type: object
          required: [recommendationId, cameraConsentRecordId]
          properties:
            recommendationId: { type: [string, 'null'], format: uuid }
            cameraConsentRecordId: { $ref: '#/components/schemas/Uuid' }
      unevaluatedProperties: false
    LiveTransitionInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [connecting, ready, reconnecting, ended, failed] }
        connectionMs: { type: integer, minimum: 0, maximum: 600000 }
        firstFrameMs: { type: integer, minimum: 0, maximum: 600000 }
        lastActionLatencyMs: { type: integer, minimum: 0, maximum: 600000 }
        errorCode: { type: [string, 'null'], maxLength: 80 }
    CredentialInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [providers]
          properties:
            providers: { type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: { type: string, const: decart } }
        - type: object
          additionalProperties: false
          required: [providers, microphoneConsentRecordId, geminiContextMode, geminiVisualConsentRecordId]
          properties:
            providers: { type: array, minItems: 1, maxItems: 2, uniqueItems: true, contains: { const: gemini }, items: { type: string, enum: [decart, gemini] } }
            microphoneConsentRecordId: { $ref: '#/components/schemas/Uuid' }
            geminiContextMode: { type: string, enum: [structured_state, sampled_video] }
            geminiVisualConsentRecordId: { type: [string, 'null'], format: uuid }
          allOf:
            - if: { properties: { geminiContextMode: { const: sampled_video } }, required: [geminiContextMode] }
              then: { properties: { geminiVisualConsentRecordId: { $ref: '#/components/schemas/Uuid' } } }
              else: { properties: { geminiVisualConsentRecordId: { type: 'null' } } }
    LiveActionBase:
      type: object
      required: [actionId, sessionId, sequence, source, observedAt, confidence]
      properties:
        actionId: { $ref: '#/components/schemas/Uuid' }
        sessionId: { $ref: '#/components/schemas/Uuid' }
        sequence: { type: integer, minimum: 1 }
        source: { type: string, enum: [direct, voice, gesture] }
        observedAt: { type: string, format: date-time }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
      allOf:
        - if: { properties: { source: { const: gesture } }, required: [source] }
          then: { properties: { confidence: { type: number, minimum: 0, maximum: 1 } } }
        - if: { properties: { source: { const: direct } }, required: [source] }
          then: { properties: { confidence: { type: 'null' } } }
    EmptyArguments: { type: object, additionalProperties: false }
    LiveNoArgumentAction:
      allOf:
        - { $ref: '#/components/schemas/LiveActionBase' }
        - type: object
          required: [type, arguments]
          properties:
            type: { type: string, enum: [next_item, previous_item, end_session, undo_last_selection] }
            arguments: { $ref: '#/components/schemas/EmptyArguments' }
      unevaluatedProperties: false
    LiveSelectAction:
      allOf:
        - { $ref: '#/components/schemas/LiveActionBase' }
        - type: object
          required: [type, arguments]
          properties:
            type: { type: string, const: select_item }
            arguments:
              allOf:
                - { $ref: '#/components/schemas/CatalogReferenceBase' }
                - type: object
                  required: [recommendationId]
                  properties: { recommendationId: { type: [string, 'null'], format: uuid } }
              unevaluatedProperties: false
      unevaluatedProperties: false
    LiveRefineAction:
      allOf:
        - { $ref: '#/components/schemas/LiveActionBase' }
        - type: object
          required: [type, arguments]
          properties:
            type: { type: string, const: refine_results }
            arguments:
              type: object
              additionalProperties: false
              required: [query, resultSetId]
              properties:
                query: { type: string, minLength: 1, maxLength: 300 }
                resultSetId: { $ref: '#/components/schemas/Uuid' }
      unevaluatedProperties: false
    LiveAddBagAction:
      allOf:
        - { $ref: '#/components/schemas/LiveActionBase' }
        - type: object
          required: [type, arguments]
          properties:
            type: { type: string, const: add_to_bag }
            arguments: { $ref: '#/components/schemas/BagItemInput' }
      unevaluatedProperties: false
    LiveRemoveBagAction:
      allOf:
        - { $ref: '#/components/schemas/LiveActionBase' }
        - type: object
          required: [type, arguments]
          properties:
            type: { type: string, const: remove_from_bag }
            arguments:
              type: object
              additionalProperties: false
              required: [bagItemId]
              properties: { bagItemId: { $ref: '#/components/schemas/Uuid' } }
      unevaluatedProperties: false
    LiveOpenRetailerAction:
      allOf:
        - { $ref: '#/components/schemas/LiveActionBase' }
        - type: object
          required: [type, arguments]
          properties:
            type: { type: string, const: open_retailer }
            arguments: { $ref: '#/components/schemas/CatalogReference' }
      unevaluatedProperties: false
    LiveActionProposal:
      oneOf:
        - { $ref: '#/components/schemas/LiveNoArgumentAction' }
        - { $ref: '#/components/schemas/LiveSelectAction' }
        - { $ref: '#/components/schemas/LiveRefineAction' }
        - { $ref: '#/components/schemas/LiveAddBagAction' }
        - { $ref: '#/components/schemas/LiveRemoveBagAction' }
        - { $ref: '#/components/schemas/LiveOpenRetailerAction' }
    LiveEndInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, enum: [customer, provider_failure, timeout] } }
