name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      VITE_API_BASE_URL: http://127.0.0.1:3000
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-test-key
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.75.0

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Start isolated local Supabase services
        run: |
          set -eu
          start_log="${RUNNER_TEMP}/supabase-start.log"
          if ! supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit >"${start_log}" 2>&1; then
            echo "::error::Local Supabase services failed to start; credential-bearing CLI output was withheld." >&2
            exit 1
          fi
          echo "Local Supabase services started."

      - name: Apply migrations and synthetic seed data
        run: bun run db:reset

      - name: Build the API and worker test image
        run: docker build -f apps/api/Dockerfile -t magic-mirror-api:test .

      - name: Run unit and contract tests
        run: bun run test

      - name: Run database policy tests
        run: bun run test:db

      - name: Lint database schema
        run: supabase db lint --local

      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: bun run test:e2e -- apps/web/e2e/smoke.spec.ts
