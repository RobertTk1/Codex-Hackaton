name: magic-mirror-dev
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: magic-mirror-web
    image:
      registry_type: DOCR
      registry: sageprovisioning
      repository: magic-mirror-web
      digest: ${MAGIC_MIRROR_DEV_WEB_IMAGE_DIGEST}
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: VITE_API_BASE_URL
        scope: RUN_TIME
        type: GENERAL
        value: ${APP_URL}/api
      - key: VITE_SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_VITE_SUPABASE_PUBLISHABLE_KEY}
  - name: magic-mirror-api
    image:
      registry_type: DOCR
      registry: sageprovisioning
      repository: magic-mirror-api
      digest: ${MAGIC_MIRROR_DEV_API_IMAGE_DIGEST}
    http_port: 3000
    run_command: bun server.js
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: APP_BASE_URL
        scope: RUN_TIME
        type: GENERAL
        value: ${APP_URL}
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        type: GENERAL
        value: ${APP_URL}
      - key: HOST
        scope: RUN_TIME
        type: GENERAL
        value: 0.0.0.0
      - key: VITE_SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_VITE_SUPABASE_PUBLISHABLE_KEY}
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_SUPABASE_SERVICE_ROLE_KEY}
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_OPENAI_API_KEY}
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_GEMINI_API_KEY}
      - key: DECART_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_DECART_API_KEY}
      - key: EMAIL_DELIVERY_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_EMAIL_DELIVERY_API_KEY}
      - key: EMAIL_FROM_ADDRESS
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_EMAIL_FROM_ADDRESS}
      - key: SHOPIFY_AGENT_PROFILE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_SHOPIFY_AGENT_PROFILE_URL}

workers:
  - name: magic-mirror-worker
    image:
      registry_type: DOCR
      registry: sageprovisioning
      repository: magic-mirror-api
      digest: ${MAGIC_MIRROR_DEV_API_IMAGE_DIGEST}
    run_command: bun worker.js
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: APP_BASE_URL
        scope: RUN_TIME
        type: GENERAL
        value: ${APP_URL}
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        type: GENERAL
        value: ${APP_URL}
      - key: HOST
        scope: RUN_TIME
        type: GENERAL
        value: 0.0.0.0
      - key: VITE_SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_VITE_SUPABASE_PUBLISHABLE_KEY}
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_SUPABASE_SERVICE_ROLE_KEY}
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_OPENAI_API_KEY}
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_GEMINI_API_KEY}
      - key: DECART_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_DECART_API_KEY}
      - key: EMAIL_DELIVERY_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_EMAIL_DELIVERY_API_KEY}
      - key: EMAIL_FROM_ADDRESS
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_EMAIL_FROM_ADDRESS}
      - key: SHOPIFY_AGENT_PROFILE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${MAGIC_MIRROR_DEV_SHOPIFY_AGENT_PROFILE_URL}

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: magic-mirror-api
    - match:
        path:
          prefix: /
      component:
        name: magic-mirror-web
